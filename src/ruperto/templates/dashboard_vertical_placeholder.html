{% extends "dashboard_base.html" %}

{% block content %}
<section class="rounded-[2rem] border border-white/70 bg-white/85 p-6 shadow-card backdrop-blur">
    <div class="max-w-3xl space-y-4">
        <p class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-500">{{ store_vertical_label }}</p>
        <h3 class="text-2xl font-semibold tracking-tight">{{ page_title }}</h3>
        <p class="text-sm leading-6 text-slate-600">
            {{ page_description }}
        </p>
        <ul class="space-y-3 text-sm text-slate-700">
            {% for item in placeholder_points %}
            <li class="rounded-2xl bg-oat px-4 py-3">{{ item }}</li>
            {% endfor %}
        </ul>
    </div>
</section>
{% endblock %}
