<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Elegí una nueva contraseña</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            ink: "#1b1c1e",
                            ember: "#ff6b35",
                            oat: "#f7f2e8",
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(255,107,53,0.16),_transparent_28%),linear-gradient(180deg,_#fffaf5_0%,_#f7f2e8_100%)] text-ink"
    >
        <main class="mx-auto flex min-h-screen max-w-lg items-center px-4 py-10">
            <section class="w-full rounded-[2rem] border border-white/70 bg-white/90 p-8 shadow-2xl backdrop-blur">
                <div class="space-y-3">
                    <span
                        class="inline-flex rounded-full bg-ember/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.25em] text-ember"
                        >Acceso del equipo</span
                    >
                    <h1 class="text-3xl font-semibold tracking-tight">Elegí una nueva contraseña</h1>
                    <p class="text-sm leading-6 text-slate-600">
                        Ingresá una contraseña nueva para volver a entrar al panel.
                    </p>
                </div>

                {% if error_message %}
                <div class="mt-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-900">
                    {{ error_message }}
                </div>
                {% endif %}

                <form action="/dashboard/reset-password" method="post" class="mt-6 space-y-4">
                    <input type="hidden" name="token" value="{{ token }}" />
                    <label class="block space-y-2 text-sm font-medium text-slate-700">
                        <span>Nueva contraseña</span>
                        <input
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none transition focus:border-ember"
                            type="password"
                            name="password"
                            autocomplete="new-password"
                            required
                        />
                    </label>
                    <label class="block space-y-2 text-sm font-medium text-slate-700">
                        <span>Repetir contraseña</span>
                        <input
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none transition focus:border-ember"
                            type="password"
                            name="confirm_password"
                            autocomplete="new-password"
                            required
                        />
                    </label>
                    <button
                        class="w-full rounded-full bg-ink px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
                        type="submit"
                    >
                        Guardar contraseña
                    </button>
                    <div class="text-center">
                        <a class="text-sm font-medium text-ember transition hover:text-ember/80" href="/dashboard/login"
                            >Volver al ingreso</a
                        >
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
